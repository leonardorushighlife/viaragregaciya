<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MALVIK-LABEL{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-warning" href="/">
                <i class="bi bi-tags-fill me-2"></i>MALVIK-LABEL
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if role == 'facade' %}active fw-bold{% endif %}" href="/facade">Фасад (Менеджер)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if role == 'labeling' %}active fw-bold{% endif %}" href="/labeling">Отдел Маркировки</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if role == 'operator' %}active fw-bold{% endif %}" href="/operator">Оператор Фасовки</a>
                    </li>
                </ul>

                <!-- Notification Bell (HTMX Polling) -->
                <div class="d-flex align-items-center" hx-get="/api/notifications/unread" hx-trigger="every 10s" hx-target="#notif-bell" hx-swap="innerHTML">
                    <div id="notif-bell" class="position-relative cursor-pointer text-white me-3">
                        {% include 'components/notification_bell.html' %}
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
