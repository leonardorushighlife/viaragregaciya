<a class="nav-link text-light position-relative" href="#" data-bs-toggle="modal" data-bs-target="#notificationsModal">
    <i class="bi bi-bell-fill fs-5"></i>
    {% if count and count > 0 %}
    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        {{ count }}
    </span>
    {% endif %}
</a>

<!-- Notifications Modal -->
<div class="modal fade text-dark" id="notificationsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-bell me-2"></i>Уведомления</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                {% if notifications %}
                <div class="list-group">
                    {% for n in notifications %}
                    <div class="list-group-item list-group-item-action flex-column align-items-start">
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1 text-danger fw-bold">{{ n.title }}</h6>
                            <small class="text-muted">{{ n.created_at.strftime('%d.%m.%Y %H:%M') }}</small>
                        </div>
                        <p class="mb-1">{{ n.message }}</p>
                    </div>
                    {% endfor %}
                </div>
                {% else %}
                <p class="text-muted text-center my-3">Новых уведомлений нет</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
